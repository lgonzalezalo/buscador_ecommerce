# config.yaml
# ------------
# Centralized project configuration. build_index.py and search.py read
# this same file, to guarantee that both always use the same embedding
# model (if they diverged, the vectors generated at indexing time
# would no longer be comparable with those from search time).

ollama:
  url: "http://localhost:11434/api/embeddings"
  model: "bge-m3"

# Default weights for the per-field lexical boost. They can be
# overridden on a per-run basis from the command line
# (--peso-nombre, etc.) without touching this file.
pesos:
  nombre: 1.0
  descripcion: 0.5
  categoria: 0.3

spellcheck:
  # Similarity threshold (0-1) for accepting an automatic spelling
  # correction. Higher = stricter (fewer corrections, fewer false
  # positives like "cena" -> "cadena").
  cutoff: 0.87

tokenizacion:
  # Words shorter than this are ignored (unless they're in the
  # negators list). This is an extra safety net on top of STOPWORDS.
  longitud_minima_palabra: 2

  # Functional words with no meaning of their own for product search.
  # Note: "con" and "sin" are deliberately NOT here, since they can be
  # part of real product names ("sudadera con capucha").
  stopwords:
    - de
    - del
    - la
    - el
    - los
    - las
    - un
    - una
    - unos
    - unas
    - por
    - para
    - en
    # "y" quoted: PyYAML (YAML 1.1) parses y/yes/no/on/off as booleans.
    - "y"
    - o
    - a
    - al
    - es
    - su
    - sus

  # Words that signal negation/exclusion ("sin X", "no X").
  # "no" quoted: unquoted, PyYAML reads it as false and negation
  # stops working (e.g. "camiseta no verde" ends up searching for verde).
  negadores:
    - sin
    - "no" # quoted: PyYAML (YAML 1.1) parses y/yes/no/on/off as booleans.
